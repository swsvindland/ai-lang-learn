name = "hablo-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# The hosted tutor model. DeepSeek is cheap and good at both Spanish and Japanese.
MODEL = "deepseek/deepseek-chat"
# RevenueCat entitlement that unlocks Plus (must match EXPO_PUBLIC_PLUS_ENTITLEMENT in the app).
ENTITLEMENT = "plus"
# Cost guardrails per subscriber.
DAILY_REQUEST_LIMIT = "400"
MAX_TOKENS = "2000"

# Usage counters and cached entitlement checks. Create with:
#   npx wrangler kv namespace create USAGE
# then paste the id below.
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Per-IP limit applied before any subscription lookup (period must be 10 or 60 seconds).
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Secrets (never commit these):
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put REVENUECAT_SECRET_KEY
